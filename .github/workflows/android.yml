name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.1"

      - name: Restore signing keystore
        env:
          MPGUARD_KS_BASE64: ${{ secrets.MPGUARD_KS_BASE64 }}
        run: |
          if [ -z "$MPGUARD_KS_BASE64" ]; then
            echo "::error::Missing repository secret MPGUARD_KS_BASE64"
            exit 1
          fi
          printf '%s' "$MPGUARD_KS_BASE64" | base64 -d > guardapp/mpguard.ks

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag must look like v1.15 or v1.15.1"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$CODE\"/; s/android:versionName=\"[^\"]*\"/android:versionName=\"$VERSION\"/" guardapp/AndroidManifest.xml
          grep -E 'android:version(Code|Name)' guardapp/AndroidManifest.xml

      - name: Build APK
        env:
          MPGUARD_KS_PASS: ${{ secrets.MPGUARD_KS_PASS }}
          MPGUARD_KEY_PASS: ${{ secrets.MPGUARD_KEY_PASS }}
          MPGUARD_KEY_ALIAS: ${{ secrets.MPGUARD_KEY_ALIAS }}
        run: bash guardapp/build.sh

      - name: Stage artifact
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cp guardapp/mp-guard.apk "dist/mp-guard-${GITHUB_REF_NAME}.apk"
          else
            cp guardapp/mp-guard.apk "dist/mp-guard-${GITHUB_SHA::7}.apk"
          fi
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp-guard-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
